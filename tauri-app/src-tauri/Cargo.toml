[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6"
# Bloque 2/3: servidor REST + WebSockets internos (reemplazo de Express + socket.io)
axum = { version = "0.8", features = ["ws", "json", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"
# Bloque 4: backups ZIP
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"
# Bloque 5: carga dinámica de librerías nativas (NDI / Blackmagic)
libloading = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
