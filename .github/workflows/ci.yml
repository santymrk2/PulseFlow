name: CI

# F13.1: corre solo en cada pull request y en cada push a las ramas de trabajo; sigue disponible a mano.
on:
    pull_request:
    push:
        branches: [main, feature/tauri-rust-migration]
    workflow_dispatch:

jobs:
    frontend:
        name: Frontend (formato de lo cambiado, presupuesto, tests, build)
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5
              with:
                  # el diff contra la base necesita el historial
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Bloqueante, pero sólo sobre los archivos de src/ que este cambio toca: el backlog de
            # formato heredado no frena a nadie, lo que se toca tiene que quedar formateado.
            - name: Check formatting (changed files)
              run: scripts/prettier-changed.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

            # Trinquete de calidad (F13.2): errores de svelte-check, `any` y colores literales no pueden subir.
            # Reemplaza al svelte-check no bloqueante de antes.
            - name: Quality budget
              run: bun run test:budget

            - name: Unit tests
              run: bun run test:unit

            # Blocking gate: a broken build fails this run.
            - name: Build
              run: bun run build

    rust:
        name: Rust (cargo check + tests)
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            # Tauri valida que existan los sidecars declarados en tauri.conf.json (externalBin).
            # shell: bash para que funcione igual en el runner de Windows (Git Bash);
            # en Windows los binarios llevan extensión .exe.
            - name: Stub sidecars
              shell: bash
              run: |
                  mkdir -p src-tauri/binaries
                  TRIPLE=$(rustc -vV | sed -n 's/host: //p')
                  EXT=""
                  if [[ "$TRIPLE" == *windows* ]]; then EXT=".exe"; fi
                  touch "src-tauri/binaries/ffmpeg-$TRIPLE$EXT" "src-tauri/binaries/ffprobe-$TRIPLE$EXT"

            - name: Cargo check
              working-directory: src-tauri
              run: cargo check --locked

            - name: Cargo test
              working-directory: src-tauri
              run: cargo test --lib --locked
