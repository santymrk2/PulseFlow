name: CI

# Manual activation for now (run from the Actions tab); can be wired to pull_request later.
on:
    workflow_dispatch:

jobs:
    frontend:
        name: Frontend (format, type-check, tests, build)
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Formatting and svelte type-check currently have a pre-existing backlog, so they are
            # reported but non-blocking for now. Flip continue-on-error off once the backlog is cleared.
            - name: Check formatting
              run: bun run test:format
              continue-on-error: true

            - name: Type-check (svelte)
              run: bun run test:svelte
              continue-on-error: true

            - name: Unit tests
              run: bun run test:unit

            # Blocking gate: a broken build fails this run.
            - name: Build
              run: bun run build

    rust:
        name: Rust (cargo check + tests)
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            # Tauri valida que existan los sidecars declarados en tauri.conf.json (externalBin).
            # shell: bash para que funcione igual en el runner de Windows (Git Bash);
            # en Windows los binarios llevan extensión .exe.
            - name: Stub sidecars
              shell: bash
              run: |
                  mkdir -p src-tauri/binaries
                  TRIPLE=$(rustc -vV | sed -n 's/host: //p')
                  EXT=""
                  if [[ "$TRIPLE" == *windows* ]]; then EXT=".exe"; fi
                  touch "src-tauri/binaries/ffmpeg-$TRIPLE$EXT" "src-tauri/binaries/ffprobe-$TRIPLE$EXT"

            - name: Cargo check
              working-directory: src-tauri
              run: cargo check --locked

            - name: Cargo test
              working-directory: src-tauri
              run: cargo test --lib --locked
