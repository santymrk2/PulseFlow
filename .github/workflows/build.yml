name: Build

on:
    workflow_dispatch:

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Install Bun
              uses: oven-sh/setup-bun@v2

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install system libraries (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Prepare FFmpeg sidecars
              run: bun run setup:sidecars --only-host

            - name: Build app
              run: bun run build:tauri

            - name: Upload bundles
              uses: actions/upload-artifact@v4
              with:
                  name: pulseflow-${{ matrix.os }}
                  path: src-tauri/target/release/bundle/
                  retention-days: 14
